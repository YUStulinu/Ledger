name: Release

# Push a tag like v0.1.0: Ledger is built for Windows and Linux (the web UI embedded, DuckDB linked as
# in CI) and attached to a GitHub release. Each archive holds the program, the Python part it calls
# (ml/: the classifier and the forecast, which need Python and numpy), and on Windows duckdb.dll.
# Unpacked anywhere, `ledger` finds ml/ next to itself and keeps its data in data/ there.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            exe: ledger.exe
          - os: ubuntu-latest
            target: linux-x64
            exe: ledger
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ml/requirements.txt
      - name: Build (the web UI, then the server with it embedded)
        run: bash scripts/build.sh
      - name: Package
        run: |
          name="ledger-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name/ml"
          cp server/bin/${{ matrix.exe }} README.md LICENSE "$name/"
          [ "$RUNNER_OS" = "Windows" ] && cp server/bin/duckdb.dll "$name/"
          cp -r ml/ledger_ml ml/requirements.txt "$name/ml/"
          find "$name" -name __pycache__ -prune -exec rm -rf {} +
      - name: Check the packaged program on the test statements
        # From a folder outside the repository, so that the program must find the packaged ml/.
        run: |
          name="ledger-${GITHUB_REF_NAME}-${{ matrix.target }}"
          exe="$PWD/$name/${{ matrix.exe }}"
          d="$PWD/testdata/synthetic"
          cd "$RUNNER_TEMP"
          "$exe" import $d/bt_2025-04_2026-09.csv $d/ing_2025-04_2025-12.csv $d/ing_2025-12_2026-09.csv $d/revolut_2025-04_2026-09.csv --no-llm
          "$exe" rates $d/rates.csv
          "$exe" query "SELECT count(*) AS lines FROM transactions" --json | tee q.json
          grep -q '1071' q.json
          "$exe" forecast --days 30
          test -f "$(dirname "$exe")/data/ledger.duckdb"
          rm -rf "$(dirname "$exe")/data"
      - name: Archive
        run: |
          name="ledger-${GITHUB_REF_NAME}-${{ matrix.target }}"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ledger-*.zip
            ledger-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ledger-*.zip
            ledger-*.tar.gz
